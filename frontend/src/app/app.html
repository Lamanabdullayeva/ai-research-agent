<div class="app">
  <header>
    <p class="eyebrow">{{ eyebrow }}</p>
    <h1>{{ heading }}</h1>
  </header>

  <main>
    <app-search-box
      [topic]="topic()"
      [isLoading]="isLoading()"
      [showClearButton]="showClearButton()"
      (topicChange)="topic.set($event)"
      (onResearch)="startResearch()"
      (onStop)="stopResearch()"
      (onClear)="clearAll()"
    />

    <div class="columns">

      <div class="left-col">
        @if (showAgentActivity()) {
          <app-agent-activity
            [events]="events()"
            [isLoading]="isLoading()"
            [toolCallCount]="toolCallCount()"
            [showSearchStats]="showSearchStats()"
            [maxSearches]="maxSearches"
          />
        }

        <app-search-history
          [history]="history()"
          [hasHistory]="hasHistory()"
          (onSelect)="loadFromHistory($event)"
          (onClear)="clearHistory()"
        />
      </div>

      <app-report-panel
        [report]="finalReport()"
        [hasReport]="hasReport()"
        [copied]="copied()"
        [isWritingReport]="isWritingReport()"
        (onCopy)="copyReport()"
        (onDownloadPdf)="downloadPDF()"
      />

    </div>
  </main>
</div>
