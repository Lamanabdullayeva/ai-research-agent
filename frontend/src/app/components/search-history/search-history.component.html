<div class="history-panel">
  <div class="history-header">
    <p class="section-label">{{ sectionTitle }}</p>
    <button class="clear-history-btn" (click)="onClear.emit()" [disabled]="!hasHistory()">
      {{ btnClear }}
    </button>
  </div>
  <div class="history-items">
    @for (item of history(); track $index) {
      <div class="history-item" (click)="onSelect.emit(item)">
        <span class="history-topic">{{ item.topic }}</span>
        <span class="history-date">{{ item.date | date:'MMM d, y' }}</span>
      </div>
    } @empty {
      <div class="history-empty">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 3"/>
        </svg>
        <p>{{ emptyLabel }}</p>
      </div>
    }
  </div>
</div>
