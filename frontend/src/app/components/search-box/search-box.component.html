<div class="search-box">
  <input
    type="text"
    [ngModel]="topic()"
    (ngModelChange)="topicChange.emit($event)"
    [placeholder]="placeholder"
    (keyup.enter)="onResearch.emit()"
    [disabled]="isLoading()"
  />
  @if (showClearButton()) {
    <button class="clear-btn" (click)="onClear.emit()" title="Clear">&#x2715;</button>
  }
  @if (isLoading()) {
    <button class="stop-btn" (click)="onStop.emit()">{{ btnStop }}</button>
  } @else {
    <button (click)="onResearch.emit()" [disabled]="!topic().trim()">{{ btnResearch }}</button>
  }
</div>

@if (showSuggestions()) {
  <div class="suggestions">
    <span class="suggestions-label">{{ tryLabel }}</span>
    @for (suggestion of suggestions; track suggestion) {
      <button class="suggestion-chip" (click)="selectSuggestion(suggestion)">{{ suggestion }}</button>
    }
  </div>
}
